name: heartbeat

# Watches the thing that watches the tee sheets. Asks the Worker whether the
# published snapshot is still fresh and emails the admins when it is not.
#
# Runs on GitHub's schedule rather than the Worker cron on purpose: the
# failure this exists to catch (dispatch token expired, Worker cron missed,
# monitor runs failing) takes the Worker path down with it. GH's schedule
# drifts by minutes, which is fine for an alarm — it is not driving checks.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # Exits non-zero when stale, so the run goes red and GitHub's own
      # failure notification acts as a second channel independent of Gmail.
      - name: Check snapshot freshness
        env:
          WORKER_URL: https://sdgolf-monitor.joshcharest1.workers.dev
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m sdgolf_monitor.heartbeat
